name: Import Issues from CSV

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import CSV to GitHub Issues
        id: import_issues
        uses: dkersch/github-issue-from-csv@v1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          csv_path: 'tasks.csv'
          title_column: 'Task Name'
          body_columns: 'Task Content'
          due_date_column: 'Due Date Text'
          status_column: 'Status'
          repo: ${{ github.repository }}
