name: Create Issues from CSV

on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: 'Path to the CSV file'
        required: true
        default: 'cleaned_tasks.csv'
      template_path:
        description: 'Path to the issue template file'
        required: true
        default: 'issue_template.md'
      write_mode:
        description: 'Set to "true" to create issues, or "false" for a dry run'
        required: true
        default: 'false'
      comment_mode:
        description: 'Set to "true" to create comments instead of issues'
        required: true
        default: 'false'

jobs:
  bulk-create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Checkout bulk-issue-creator
        uses: actions/checkout@v4
        with:
          repository: benbalter/bulk-issue-creator
          path: bulk-issue-creator

      - name: Set up Ruby and Install Dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: bulk-issue-creator

      - name: Run Bulk Issue Creator Script
        run: |
          bundle exec ./bin/bulk-issue-creator \
            --csv-path ../${{ github.event.inputs.csv_path }} \
            --template-path ../${{ github.event.inputs.template_path }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --write ${{ github.event.inputs.write_mode }} \
            --comment ${{ github.event.inputs.comment_mode }}
        working-directory: bulk-issue-creator
