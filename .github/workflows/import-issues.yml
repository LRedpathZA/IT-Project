name: Create Issues from CSV

on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: 'Path to the CSV file'
        required: true
        default: 'cleaned_tasks.csv'

jobs:
  bulk-create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install csvkit
        run: sudo apt-get install -y csvkit

      - name: Create Issues from CSV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CSV_PATH: ${{ github.event.inputs.csv_path }}
        run: |
          echo "Processing $CSV_PATH..."
          # Skip header, read each row
          tail -n +2 "$CSV_PATH" | while IFS=, read -r title body labels assignees
          do
            echo "Creating issue: $title"
            
            # Build labels/assignees if present
            label_arg=""
            assignee_arg=""
            if [ ! -z "$labels" ]; then
              label_arg="--label $(echo $labels | tr -d '"')"
            fi
            if [ ! -z "$assignees" ]; then
              assignee_arg="--assignee $(echo $assignees | tr -d '"')"
            fi

            # Create the issue
            gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --body "$body" \
              $label_arg \
              $assignee_arg
          done
