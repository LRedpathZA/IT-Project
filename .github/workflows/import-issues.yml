name: Import Issues from CSV

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Import CSV to GitHub Issues
        uses: github-actions-for-issues/import-issues-from-csv@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          csv_file_path: cleaned_tasks.csv
          issue_title_column: 'Task Name'
          issue_body_columns: 'Task Content,Due Date Text,Status'
          issue_labels: 'imported-task'
